<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>NOME FANTASIA</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>NOME FANTASIA</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cursos.html">Cursos</a>
                <a href="perfil.html">Perfil</a>
                <input type="text" placeholder="Procurar..">
            </nav>
        </header>
        <main>
            <h2>Cursos</h2>
            <p>Confira nossos cursos disponíveis:</p>
            <select id="categoria" name="categoria">
                <option value="default">Selecione a categoria</option>
                <option value="Tecnicos">Cursos Técnicos</option>
                <option value="Graduacao">Graduação</option>
                <option value="Cursos Livres">Cursos Livres</option>
            </select>
            <button type="button" id="filtrar">Filtrar</button>

            <div class="painel" id="Tecnicos">
                <h3>Cursos Técnicos</h3>
                <p>Lista de cursos técnicos disponíveis.</p>
                <select id="subcategoria" name="subcategoria">
                    <option value="default">Selecione a subcategoria</option>
                    <option value="informatica">Informática</option>
                    <option value="saude">Saúde</option>
                    <option value="administração">Administração</option>
                </select>
            </div>
            <div class="painel" id="graduacao">
                <h3> Graduação</h3>
                <p>Lista de cursos de graduação disponíveis.</p>
                <section class="graduacao">
                    <p value="engenharia">Engenharia</p>
                    <p value="direito">Direito</p>
                    <p value="medicina">Medicina</p>
                </section>
            </div>
            <div class="painel" id="Livres">
                <h3>Cursos Livres</h3>
                <p>Lista de cursos livres disponíveis.</p>
                <section class="livres">
                    <p value="artes">Artes</p>
                    <p value="idiomas">Idiomas</p>
                    <p value="negocios">Negócios</p>
            </section>
            </div>
        </main>
    </body>
</html>
