<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha.com</title>
    <link rel="stylesheet" href="styleMat.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Trilha.com</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="cursos.html">Cursos</a>
            <a href="perfil.html">Perfil</a>
            <form id="formPesquisa">
                <input type="text" id="pesquisa" placeholder="Procurar..">
            </form>  
        </nav>
    </header>
<main>
    <h2>Formulário de Matrícula</h2>

    <form id="formMatricula">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite Seu Nome">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite Seu Email">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite Seu Telefone">


    <button type="submit">Enviar Matrícula</button>
    </form>

    <p id="mensagemSucesso" style="display: none; color:green">Matrícula enviada com sucesso!</p>
    <p id="mensagemErro" style="display:none; color:red">Preencha todos os campos e confirme o curso antes de enviar.</p>
</main>
</body>
</html>
